{% extends "base.html" %}
{% block title %}Log in &middot; ISMS Compliance Tracker{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-brand">
    <div class="mark">ISMS Compliance Tracker</div>
    <div class="sub">ISO/IEC 27001:2022</div>
  </div>

  <form class="card login-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card-head"><h2>Log in</h2></div>
    <div class="card-body">
      <label class="fl" for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus autocomplete="username"
             value="{{ request.form.email or '' }}">

      <label class="fl" for="password" style="margin-top: 14px">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <button class="btn" type="submit" style="margin-top: 18px; width: 100%">Log in</button>
      <p class="help" style="margin-top: 12px">No account? Ask your ISMS admin to create one.</p>
    </div>
  </form>
</div>
{% endblock %}
